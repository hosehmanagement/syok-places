name: Build place packs

# Runs on the 1st of every month (and whenever you press "Run workflow").
# 5 parallel jobs download 20 cities each from OpenStreetMap + Wikivoyage,
# then one job splits everything into small area files and publishes them
# to the "data" branch (history is replaced each time, so the repo stays small).
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python harvest.py part ${{ matrix.part }} 5
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: out/part-${{ matrix.part }}.json
          retention-days: 3

  publish:
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: out
      - run: python harvest.py merge
      - name: Publish to the data branch
        run: |
          cd site
          cp ../README.md .
          git init -q -b data
          git config user.name "syok-places-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Place packs $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
